name: Build Neural Map Maker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Generate Android application files
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f index.html ]; then
            echo "ERROR: index.html was not found in the repository root."
            exit 1
          fi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "NeuralMapMaker"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/seraj/neuralmapmaker

          cp index.html app/src/main/assets/index.html

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.seraj.neuralmapmaker'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.seraj.neuralmapmaker'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '0.1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Neural Map Maker"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/seraj/neuralmapmaker/MainActivity.java <<'EOF'
          package com.seraj.neuralmapmaker;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.os.Environment;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends Activity {

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.getSettings().setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {

                          if (filePathCallback != null) {
                              filePathCallback.onReceiveValue(null);
                          }

                          filePathCallback = callback;

                          try {
                              Intent intent = params.createIntent();
                              startActivityForResult(
                                  intent,
                                  FILE_CHOOSER_REQUEST
                              );
                          } catch (Exception e) {
                              filePathCallback = null;

                              Toast.makeText(
                                  MainActivity.this,
                                  "Could not open file picker",
                                  Toast.LENGTH_SHORT
                              ).show();

                              return false;
                          }

                          return true;
                      }
                  });

                  webView.addJavascriptInterface(
                      new AppBridge(),
                      "AndroidBridge"
                  );

                  setContentView(webView);

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }

              private class AppBridge {

                  @JavascriptInterface
                  public void saveFile(
                          String fileName,
                          String mimeType,
                          String base64Data) {

                      try {
                          byte[] data = android.util.Base64.decode(
                              base64Data,
                              android.util.Base64.DEFAULT
                          );

                          String safeName = fileName.replaceAll(
                              "[^a-zA-Z0-9._-]",
                              "_"
                          );

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {

                              ContentValues values = new ContentValues();

                              values.put(
                                  MediaStore.Downloads.DISPLAY_NAME,
                                  safeName
                              );

                              values.put(
                                  MediaStore.Downloads.MIME_TYPE,
                                  mimeType
                              );

                              values.put(
                                  MediaStore.Downloads.RELATIVE_PATH,
                                  Environment.DIRECTORY_DOWNLOADS
                              );

                              Uri uri = getContentResolver().insert(
                                  MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                                  values
                              );

                              if (uri == null) {
                                  throw new Exception(
                                      "Could not create download"
                                  );
                              }

                              try (
                                  OutputStream out =
                                      getContentResolver().openOutputStream(uri)
                              ) {
                                  if (out == null) {
                                      throw new Exception(
                                          "Could not open download"
                                      );
                                  }

                                  out.write(data);
                              }

                          } else {

                              File dir = getExternalFilesDir(
                                  Environment.DIRECTORY_DOWNLOADS
                              );

                              if (dir == null) {
                                  throw new Exception(
                                      "Downloads folder unavailable"
                                  );
                              }

                              if (!dir.exists()) {
                                  dir.mkdirs();
                              }

                              File file = new File(dir, safeName);

                              try (
                                  FileOutputStream out =
                                      new FileOutputStream(file)
                              ) {
                                  out.write(data);
                              }
                          }

                          runOnUiThread(() ->
                              Toast.makeText(
                                  MainActivity.this,
                                  "Saved " + safeName,
                                  Toast.LENGTH_LONG
                              ).show()
                          );

                      } catch (Exception e) {

                          runOnUiThread(() ->
                              Toast.makeText(
                                  MainActivity.this,
                                  "Export failed: " + e.getMessage(),
                                  Toast.LENGTH_LONG
                              ).show()
                          );
                      }
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (requestCode == FILE_CHOOSER_REQUEST) {

                      if (filePathCallback == null) {
                          return;
                      }

                      Uri[] results =
                          WebChromeClient.FileChooserParams.parseResult(
                              resultCode,
                              data
                          );

                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {

                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          echo "Android application files generated successfully."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neural-map-maker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
